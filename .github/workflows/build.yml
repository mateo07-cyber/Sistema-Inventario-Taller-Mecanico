name: Build .NET

on:
  push:
    branches:
      - feature/capa-servicio
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependencias
        run: dotnet restore SistemaInventarioTallerMecanico.API.slnx
      - name: Compilar solucion
        run: dotnet build SistemaInventarioTallerMecanico.API.slnx --configuration Release --no-restore
